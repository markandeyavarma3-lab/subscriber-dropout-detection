# Prometheus scrape configuration for the subscriber dropout service.
#
# One target covers both families of metric: the API exposes its own live
# serving counters *and* the last scheduled pipeline run's drift and promotion
# state, which it reads from the run report on disk. That avoids running a
# Pushgateway just to collect from a batch job - and avoids the stale-value
# problem a Pushgateway brings with it.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: subscriber-dropout

rule_files:
  - /etc/prometheus/alerts.yml

# Where firing alerts are sent. Without this, every rule in alerts.yml
# evaluates correctly and then goes nowhere: Prometheus shows it as firing on
# its own /alerts page and nobody who is not already looking ever finds out.
# Alertmanager is what turns evaluation into notification - grouping,
# deduplication, inhibition and silences all live there, not here.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: subscriber-api
    # Not the conventional /metrics: that path already serves a documented
    # JSON contract that predates Prometheus here.
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["subscriber-api:8000"]
        labels:
          component: serving

  # The streaming scorer has no API, so it serves its own metrics on 8001.
  # Scraped separately from the API: they are different workloads that fail in
  # different ways, and a dead consumer should not be hidden by a healthy API.
  - job_name: stream-scorer
    static_configs:
      - targets: ["stream-scorer:8001"]
        labels:
          component: streaming

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The router itself. If Alertmanager is down, every alert above is silently
  # swallowed - so it needs to be watched by the thing that feeds it.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
