# Every SDD_* setting the containers read. Deliberately a ConfigMap and not
# baked into the image: the same image runs in every environment, and only
# this changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: subscriber-config
data:
  # Promotion is the only way a model reaches production here. "registry"
  # rather than "auto" on purpose: in a cluster, silently falling back to a
  # stale file baked into the image is worse than failing readiness loudly.
  SDD_MODEL_SOURCE: "registry"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  SDD_DATABASE_URL: "postgresql+psycopg://subscriber:subscriber@postgres:5432/warehouse"
  SDD_STREAM_BROKERS: "redpanda:9092"

  # Shadow scoring runs a second model inline, so it costs latency on every
  # request. Sampled in the cluster rather than run on all traffic.
  SDD_SHADOW_ENABLED: "1"
  SDD_SHADOW_SAMPLE_RATE: "0.2"
