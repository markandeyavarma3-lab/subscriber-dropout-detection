# Bring the API up with:  docker compose up --build
# Then open http://localhost:8000/docs

services:
  # The event warehouse. Locally the project falls back to SQLite, so this is
  # only needed once you want the full stack; SDD_DATABASE_URL switches it.
  postgres:
    image: postgres:16-alpine
    container_name: subscriber-warehouse
    environment:
      POSTGRES_USER: subscriber
      POSTGRES_PASSWORD: subscriber
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscriber -d warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Experiment tracking and the model registry. The registry requires a
  # database-backed store, so this points at Postgres rather than a file path.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.1
    container_name: subscriber-mlflow
    depends_on:
      postgres:
        condition: service_healthy
    # Not `mlflow server --host 0.0.0.0`: verified against this exact image
    # (3.1.1) that gunicorn ends up bound to 127.0.0.1 regardless - reliably,
    # on every fresh container boot - even though `mlflow server --host
    # 0.0.0.0` binds correctly when typed at an interactive shell inside the
    # same running container. `--gunicorn-opts '-b 0.0.0.0:...'` does not
    # override it either; the flag never reaches the spawned gunicorn
    # process. With the host stuck on loopback, nothing outside the
    # container's own network namespace - not the host, not Prometheus, not
    # another container - can ever reach it, and `docker compose up` gives no
    # error: the server logs "Listening" and looks healthy while being
    # unreachable.
    #
    # This runs gunicorn directly against MLflow's own WSGI app instead,
    # which is MLflow's documented pattern for production deployment behind a
    # real WSGI server. The two underscore-prefixed variables are what
    # `mlflow server` itself sets internally before it (fails to) launch
    # gunicorn - reusing them here reproduces its configuration exactly and
    # only replaces the one step that was going wrong.
    command: >
      sh -c "pip install --no-cache-dir psycopg2-binary &&
             export _MLFLOW_SERVER_FILE_STORE=postgresql://subscriber:subscriber@postgres:5432/warehouse &&
             export _MLFLOW_SERVER_ARTIFACT_ROOT=/mlflow/artifacts &&
             python -m gunicorn -b 0.0.0.0:5000 -w 4 mlflow.server:app"
    ports:
      # Host side moved off 5000: macOS's Control Center (AirPlay Receiver)
      # binds *:5000 by default on Sonoma and later, and there is no reason to
      # make everyone turn off a system feature to run this stack. The
      # container's own port is untouched, so nothing inside the compose
      # network - or MLFLOW_TRACKING_URI pointed at the container - changes.
      - "5001:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    restart: unless-stopped

  subscriber-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: subscriber-dropout-api:latest
    container_name: subscriber-dropout-api
    ports:
      - "8000:8000"
    environment:
      # Override any SDD_* setting from src/config/settings.py here.
      SDD_API_PORT: "8000"
      # SDD_DECISION_THRESHOLD: "0.35"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

    # The image already contains a trained model.joblib. To serve a model you
    # trained on the host instead (retrain without rebuilding), uncomment:
    # volumes:
    #   - ./src/models/artifacts:/app/src/models/artifacts:ro

  # Scrapes the API's /metrics/prometheus and keeps the history the
  # in-process window cannot: it resets on every restart.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: subscriber-prometheus
    depends_on:
      - subscriber-api
      - alertmanager
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  # Turns firing rules into notifications. Prometheus evaluates; Alertmanager
  # groups, dedupes, inhibits and routes. Its receivers ship with no
  # integration attached - see the comment at the top of alertmanager.yml for
  # why credentials stay out of the repo - so alerts are visible and
  # silenceable at :9093 rather than pushed outbound.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: subscriber-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Alertmanager needs to know its own address to build the links it puts
      # in notifications; without this they point at the container hostname.
      - --web.external-url=http://localhost:9093
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  # Comes up already wired: the datasource and dashboard are provisioned from
  # deploy/grafana, so there is nothing to click before anything is visible.
  grafana:
    image: grafana/grafana:11.2.0
    container_name: subscriber-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Local demo stack only - never run an anonymous-admin Grafana anywhere
      # a stranger can reach it.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  # Kafka-compatible broker, but a single binary with no ZooKeeper or KRaft
  # quorum to run. For a demo stack that is the whole argument: same protocol,
  # a fraction of the operational surface.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: subscriber-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
      - --check=false
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Consumes subscriber events, scores them, writes risk scores back. Shares
  # the API image - it is the same model and the same feature pipeline, just a
  # different entry point.
  stream-scorer:
    build:
      context: .
      dockerfile: Dockerfile
    image: subscriber-dropout-api:latest
    container_name: subscriber-stream-scorer
    depends_on:
      redpanda:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir kafka-python &&
             python -m src.streaming.kafka --brokers redpanda:9092"
    ports:
      # Its own Prometheus endpoint: the scorer has no API to scrape.
      - "8001:8001"
    environment:
      SDD_STREAM_BROKERS: redpanda:9092
    # The Dockerfile bakes a HEALTHCHECK that curls :8000/health into the
    # shared image - correct for subscriber-api, meaningless here, since this
    # container runs the Kafka consumer and never binds 8000. Left inherited,
    # `docker ps` reports this service permanently unhealthy regardless of
    # whether it is actually consuming, which is exactly backwards for a
    # health signal. Disabled rather than pointed at :8001/metrics: that
    # endpoint exists to be scraped, not polled every 30s, and a stalled
    # consumer already surfaces correctly via the StreamScorerDown alert on
    # `up{job="stream-scorer"}`.
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  warehouse-data:
  redpanda-data:
  mlflow-artifacts:
  prometheus-data:
  grafana-data:
  alertmanager-data:
