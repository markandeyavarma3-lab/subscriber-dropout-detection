[project]
name = "subscriber-dropout-detection"
version = "1.0.0"
description = "End-to-end MLOps project predicting subscriber dropout, served over a FastAPI API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "scikit-learn>=1.4,<2.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "joblib>=1.3,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5,<1.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Makes `pytest` and `python -m pytest` resolve `src.` imports identically.
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends()/Field() defaults are idiomatic in signatures.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
