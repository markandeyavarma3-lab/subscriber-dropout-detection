name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Train the model end to end
        run: python -m src.models.train

      - name: Evaluate the saved artifact
        run: python -m src.models.evaluate

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: src/models/artifacts/
          retention-days: 7

  warehouse:
    name: Train via the event warehouse (temporal split)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Simulate the warehouse, train on a temporal split, and gate promotion
        run: python -m src.models.train --source warehouse --promote
        # Both the warehouse and MLflow's tracking store default to SQLite
        # files under the project directory, so this needs no external
        # database and no Docker - only the compose stack's Postgres path does.

      - name: Serve the promoted model and smoke-test /predict
        run: |
          python -m uvicorn src.api.main:app --host 127.0.0.1 --port 8010 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8010/health > /dev/null; then break; fi
            sleep 1
          done

          echo "--- /model-info (must show served_from: registry) ---"
          curl -sf http://127.0.0.1:8010/model-info | tee /tmp/model-info.json
          grep -q '"served_from":"registry"' /tmp/model-info.json

          echo "--- /metrics/prometheus (must expose the scrape target) ---"
          curl -sf http://127.0.0.1:8010/metrics/prometheus | tee /tmp/prom.txt | grep -E "^subscriber_" | head
          grep -q "subscriber_model_loaded 1.0" /tmp/prom.txt
          grep -q "subscriber_model_served_from{source=\"registry\"} 1.0" /tmp/prom.txt

          echo "--- /predict ---"
          curl -sf -X POST http://127.0.0.1:8010/predict \
            -H 'Content-Type: application/json' \
            -d '{"tenure_days":95,"plan_type":"standard","monthly_fee":19.99,
                 "avg_session_count_last_30d":2.0,"last_activity_days_ago":34,
                 "support_tickets_last_90d":3,"payment_failures_last_6m":2,
                 "discounts_used_last_6m":1,"is_auto_renew_enabled":false}'

      - name: Upload warehouse-trained artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-model-artifacts
          path: src/models/artifacts/
          retention-days: 7

  pipeline:
    name: Run the orchestrated retraining pipeline
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: First run - populates the warehouse, trains, promotes unopposed
        run: python -m src.orchestration.flows run

      - name: Second run - must be idempotent and must reject an identical challenger
        run: |
          python -m src.orchestration.flows run

          python - <<'PY'
          import json, pathlib

          report = json.loads(
              pathlib.Path("src/models/artifacts/last_pipeline_run.json").read_text()
          )

          # Ingest must not have rebuilt the warehouse: a scheduled job that
          # regenerates its own inputs every run is not reproducible.
          assert report["ingest"]["regenerated"] is False, "second run regenerated the warehouse"

          # Retraining identical data must not churn the registry.
          assert report["training"]["promoted"] is False, "identical challenger was promoted"
          assert report["needs_attention"] is True, "a rejected challenger should be flagged"

          print("idempotent ingest and gate rejection both confirmed")
          PY

      - name: Train a distinct challenger and prove shadow scoring works
        run: |
          # A second model, registered as @challenger but never promoted.
          python -m src.models.train --source warehouse --track \
            --n-estimators 40 --max-depth 5 --learning-rate 0.3

          python -m uvicorn src.api.main:app --host 127.0.0.1 --port 8020 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8020/health > /dev/null; then break; fi
            sleep 1
          done

          # Drive real traffic through the served endpoint.
          for _ in $(seq 1 12); do
            curl -sf -X POST http://127.0.0.1:8020/predict \
              -H 'Content-Type: application/json' \
              -d '{"tenure_days":95,"plan_type":"standard","monthly_fee":19.99,
                   "avg_session_count_last_30d":2.0,"last_activity_days_ago":34,
                   "support_tickets_last_90d":3,"payment_failures_last_6m":2,
                   "discounts_used_last_6m":1,"is_auto_renew_enabled":false}' > /dev/null
          done

          curl -sf http://127.0.0.1:8020/monitoring/shadow | tee /tmp/shadow.json

          python - <<'PY'
          import json, pathlib

          report = json.loads(pathlib.Path("/tmp/shadow.json").read_text())

          # A distinct challenger must actually be shadowing.
          assert report["active"] is True, "shadow scoring never activated"
          assert report["compared_total"] >= 12, report["compared_total"]

          # The hard rule: the shadow model must not be failing on live input.
          assert report["errors_total"] == 0, "challenger errored on live traffic"

          # And it must make no accuracy claim it has no labels to support.
          for field in ("accuracy", "auc", "pr_auc", "better", "winner"):
              assert field not in report, f"shadow report claims {field} without labels"

          print("shadow active:", report["compared_total"], "comparisons,",
                "agreement", report["agreement_rate"])
          PY

      - name: Third run - inject drift, which must be detected
        run: |
          python -m src.orchestration.flows run --drift

          python - <<'PY'
          import json, pathlib

          report = json.loads(
              pathlib.Path("src/models/artifacts/last_pipeline_run.json").read_text()
          )
          drift = report["drift"]

          assert drift["available"] is True, "drift check had no baseline to compare against"
          assert drift["overall_verdict"] == "significant", (
              f"injected drift was not detected: {drift['overall_verdict']}"
          )
          print("drift detected:", drift["drifted_features"])
          PY

  streaming:
    name: Streaming scorer (in-memory broker)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Train a model for the scorer to use
        run: python -m src.models.train

      - name: Drive the consume-score-produce loop, including poison messages
        # No broker: the loop runs against the in-memory transport, which is
        # what makes the failure paths testable at all. Only the thin Kafka
        # adapter needs real infrastructure, and it is pure translation.
        run: |
          python - <<'PY'
          import json

          from src.streaming.runner import StreamingScorer
          from src.streaming.transport import InMemoryBroker

          SUB = {
              "tenure_days": 95, "plan_type": "standard", "monthly_fee": 19.99,
              "avg_session_count_last_30d": 2.0, "last_activity_days_ago": 34,
              "support_tickets_last_90d": 3, "payment_failures_last_6m": 2,
              "discounts_used_last_6m": 1, "is_auto_renew_enabled": False,
          }

          broker = InMemoryBroker()
          for i in range(30):
              broker.publish("subscriber-events", {**SUB, "subscriber_id": f"SUB-{i}"})
          broker.publish("subscriber-events", b"{{{ not json")
          broker.publish("subscriber-events", {"subscriber_id": "SUB-BAD", "tenure_days": 1})

          scorer = StreamingScorer(
              consumer=broker.consumer("subscriber-events"),
              producer=broker.producer(),
              output_topic="subscriber-scores",
              dead_letter_topic="subscriber-scores-dlq",
              batch_size=10,
          )
          stats = scorer.run(max_batches=10)

          scores = broker.messages("subscriber-scores")
          dlq = broker.messages("subscriber-scores-dlq")

          # Good records scored, bad ones isolated - not the other way round.
          assert len(scores) == 30, len(scores)
          assert len(dlq) == 2, len(dlq)
          assert stats.produce_failures == 0

          # Everything accounted for: nothing silently dropped.
          assert broker.committed["subscriber-events"] == 32

          # Dead letters must be replayable, or they are just log lines.
          assert dlq[0]["payload"], "dead letter lost its payload"
          assert dlq[1]["reason"], "dead letter lost its reason"

          print("streaming:", stats.summary())
          PY

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t subscriber-dropout-api:${{ github.sha }} .

      - name: Smoke-test the image
        run: |
          docker run -d --name api -p 8000:8000 subscriber-dropout-api:${{ github.sha }}

          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done

          echo "--- /health ---"
          curl -sf http://localhost:8000/health

          echo "--- / (dashboard) ---"
          curl -sf http://localhost:8000/ | grep -q "Subscriber Dropout Detection"

          echo "--- /predict ---"
          curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"tenure_days":95,"plan_type":"standard","monthly_fee":19.99,
                 "avg_session_count_last_30d":2.0,"last_activity_days_ago":34,
                 "support_tickets_last_90d":3,"payment_failures_last_6m":2,
                 "discounts_used_last_6m":1,"is_auto_renew_enabled":false}'

          docker rm -f api
